<html>
<head>
    <script src="./luxon-1.24.1.js" type="text/javascript"></script>
    <script src="./chart-3.0.0-beta.9.js" type="text/javascript"></script>
    <script src="./chartjs-adapter-luxon-0.2.1.js" type="text/javascript"></script>
    <script src="./chartjs-chart-financial.js" type="text/javascript"></script>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        #chartcontainer {
            position: relative;
            width: 100%;
            height: 100%;
        }

        canvas {
            -moz-user-select: none;
            -webkit-user-select: none;
            -ms-user-select: none;
            display: block;
        }
    </style>
</head>
<body oncontextmenu="return false">
    <div id="chartcontainer">
        <canvas id="canvas"></canvas>
    </div>
    <script>
        var ctx = document.getElementById('canvas').getContext('2d');
        var chart = null;

        // The financial plugin sizes candles from the number of points in the dataset, and its
        // default time axis throws on an empty dataset. So we keep the full history in allData and
        // only ever feed a fixed-size *window* of candles to the chart. This keeps candles a
        // readable, consistent width at any history depth. Dragging moves the window through
        // history (horizontal) and the price range (vertical); the wheel changes the window size.
        var allData = [];
        var winSize = 100;        // number of candles shown at once
        var winEnd = 0;           // exclusive index of the right edge within allData
        var MIN_WIN = 25;         // most zoomed in  (widest candles)
        var MAX_WIN = 200;        // most zoomed out (narrowest candles)

        // Price axis. By default it auto-fits the visible window; dragging up/down switches it to
        // manual mode (it stays where the user puts it). Double-click restores auto-fit.
        var yMin = null, yMax = null, yManual = false;

        function buildSlice() {
            winSize = Math.max(MIN_WIN, Math.min(MAX_WIN, Math.min(winSize, allData.length)));
            winEnd = Math.max(winSize, Math.min(allData.length, winEnd));
            return allData.slice(winEnd - winSize, winEnd);
        }

        function autoFitY(slice) {
            var lo = Infinity, hi = -Infinity;
            for (var i = 0; i < slice.length; i++) {
                if (slice[i].l < lo) lo = slice[i].l;
                if (slice[i].h > hi) hi = slice[i].h;
            }
            var pad = (hi - lo) * 0.08 || Math.abs(hi) * 0.01 || 1;
            yMin = lo - pad;
            yMax = hi + pad;
        }

        // Pan/zoom: just update the existing chart's data and ranges (fast, no animation).
        function renderWindow() {
            if (!chart || allData.length === 0) return;

            var slice = buildSlice();
            if (!yManual) autoFitY(slice);

            chart.data.datasets[0].data = slice;
            chart.options.scales.x.min = slice[0].t;
            chart.options.scales.x.max = slice[slice.length - 1].t;
            chart.options.scales.y.min = yMin;
            chart.options.scales.y.max = yMax;

            chart.update('none');
        }

        // New symbol: (re)create the chart with the most recent window. The chart is always built
        // with data present so the financial plugin's time axis never sees an empty tick list.
        function createChart(name, data) {
            allData = data || [];

            if (allData.length === 0) {
                if (chart) { chart.destroy(); chart = null; }
                return;
            }

            winSize = Math.min(100, allData.length);
            winEnd = allData.length;
            yManual = false;

            var slice = buildSlice();
            autoFitY(slice);

            if (chart) chart.destroy();

            chart = new Chart(ctx, {
                type: 'candlestick',
                data: { datasets: [{ label: name, data: slice }] },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: { duration: 0 },
                    scales: {
                        x: { type: 'timeseries', min: slice[0].t, max: slice[slice.length - 1].t },
                        y: { min: yMin, max: yMax }
                    }
                }
            });
        }

        // --- Mouse: drag to pan (time horizontally, price vertically), wheel to zoom ---
        (function () {
            var canvas = document.getElementById('canvas');
            var dragging = false;
            var lastX = 0, lastY = 0;
            var accum = 0;        // fractional bars accumulated while dragging
            var dragDyTotal = 0;  // cumulative vertical movement of the current drag
            var onAxis = false;   // drag started over the price axis (scale instead of pan)

            canvas.addEventListener('mousedown', function (e) {
                dragging = true;
                lastX = e.offsetX;
                lastY = e.offsetY;
                accum = 0;
                dragDyTotal = 0;
                // Over the price-axis strip (left of / right of the plot) we scale the price range.
                onAxis = chart && chart.chartArea &&
                    (e.offsetX < chart.chartArea.left || e.offsetX > chart.chartArea.right);
                canvas.style.cursor = onAxis ? 'ns-resize' : 'grabbing';
            });

            function stop() { dragging = false; canvas.style.cursor = 'default'; }
            window.addEventListener('mouseup', stop);
            canvas.addEventListener('mouseleave', stop);

            canvas.addEventListener('mousemove', function (e) {
                if (!dragging || !chart || allData.length === 0 || !chart.chartArea) return;

                // Over the price axis: scale the price range around its centre. Dragging up
                // enlarges the visible price span (candles get smaller), dragging down shrinks it.
                if (onAxis) {
                    var dyAxis = e.offsetY - lastY;
                    lastX = e.offsetX;
                    lastY = e.offsetY;
                    if (dyAxis !== 0 && yMin !== null) {
                        var axisH = chart.chartArea.bottom - chart.chartArea.top;
                        var centre = (yMin + yMax) / 2;
                        var half = (yMax - yMin) / 2;
                        var factor = Math.max(0.5, Math.min(2, 1 - (dyAxis / axisH) * 1.5));
                        half *= factor;
                        yMin = centre - half;
                        yMax = centre + half;
                        yManual = true;
                        renderWindow();
                    }
                    return;
                }

                var changed = false;

                // Horizontal -> pan the window through history.
                var pxPerBar = (chart.chartArea.right - chart.chartArea.left) / winSize;
                if (pxPerBar > 0) {
                    accum += (e.offsetX - lastX) / pxPerBar;
                    var step = Math.trunc(accum);
                    if (step !== 0) {
                        accum -= step;
                        // Dragging right (positive) reveals older data: move the window back.
                        winEnd = Math.max(winSize, Math.min(allData.length, winEnd - step));
                        changed = true;
                    }
                }

                // Vertical -> pan the price range. Engage manual mode once the drag clearly moves
                // vertically, so pure horizontal pans keep auto-fitting the price axis.
                var dyPx = e.offsetY - lastY;
                dragDyTotal += dyPx;
                if (!yManual && Math.abs(dragDyTotal) > 6) yManual = true;
                if (yManual && dyPx !== 0 && yMin !== null) {
                    var pricePerPx = (yMax - yMin) / (chart.chartArea.bottom - chart.chartArea.top);
                    yMin += dyPx * pricePerPx;
                    yMax += dyPx * pricePerPx;
                    changed = true;
                }

                lastX = e.offsetX;
                lastY = e.offsetY;

                if (changed) renderWindow();
            });

            // Double-click restores automatic price fitting.
            canvas.addEventListener('dblclick', function () {
                yManual = false;
                renderWindow();
            });

            canvas.addEventListener('wheel', function (e) {
                e.preventDefault();
                if (!chart || allData.length === 0) return;

                // Wheel up = zoom in (fewer candles, wider); wheel down = zoom out.
                winSize = Math.round(winSize * (e.deltaY < 0 ? 0.85 : 1.18));
                renderWindow();
            }, { passive: false });
        })();
    </script>
</body>
</html>
